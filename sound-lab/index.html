<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声浪调试台 · 五状态</title><link rel="stylesheet" href="lab.css"><body>
<header><span>FORMULA RACING / AUDIO LAB 05 · 五状态调试</span><h1>先把每种声音分清楚</h1><p>升挡、加速、降挡、刹车减速、无油门分别使用独立片段。默认锁定挡位，先听完整的升调。</p></header>
<main><section><h2>① 选择原视频</h2><input id="file" type="file" accept="audio/*,video/*"><p id="status" role="status">选择原录音后，逐项标记五种声音。未标记的状态保持静音。</p><video id="original" controls playsinline></video></section>
<section><h2>② 驾驶台</h2><div class="instruments"><div>挡位<strong id="gear">1</strong></div><div>RPM<strong id="rpm">5500</strong></div><div>KM/H<strong id="speed">0</strong></div></div><p id="state" role="status">已停止</p><div class="row"><button id="start" disabled>启动声音</button><button id="stop">停止</button><button id="reset">回到起点</button><label><input id="auto" type="checkbox"> 自动换挡（默认关闭，听完整升调）</label></div><div class="row"><button id="throttle">按住油门 · W</button><button id="brake">按住刹车 · S</button><button id="coast">无油门</button><button id="up">升挡 · E</button><button id="down">降挡 · Q</button></div><label>音量 <input id="volume" type="range" min="0" max="1" step=".01" value=".3"></label></section>
<section><h2>③ 五种声音独立标记</h2><p>同挡加速、同挡减速、无油门：选没有换挡的稳定片段。升挡、降挡：选完整的一次换挡，触发时只播放一次。标记范围最长 3 秒。</p><div id="editors"></div><div class="row"><button id="apply" disabled>执行全部改动并试听</button><button id="export" disabled>下载五状态标记</button><label>载入标记 <input id="import" type="file" accept=".json" disabled></label></div><p id="applied" role="status">尚未载入音轨</p></section></main><footer>独立调试台 · 这次改动尚未接回游戏 · 循环片段会取标记范围内较稳定的一小段，请逐项试听。</footer><script type="module" src="v5/lab.js?v=states1"></script></body></html>
